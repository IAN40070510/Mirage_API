services:
  mirage:
    build:
      context: .
      target: runtime
    image: mirage-api:local
    init: true
    environment:
      MIRAGE_DEMO_MODE: ${MIRAGE_DEMO_MODE:-fallback}
      MIRAGE_DEMO_ORIGIN: http://127.0.0.1:${MIRAGE_HTTP_PORT:-8000}
      MIRAGE_DEMO_CONFIG: /app/configs/demo.yaml
      MIRAGE_DEMO_OUTPUT: /app/generated/demo
      MIRAGE_LLM_CONFIG: /app/configs/llm.yaml
    ports:
      - "127.0.0.1:${MIRAGE_HTTP_PORT:-8000}:8000"
    volumes:
      - mirage_output:/app/generated
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped

  # 可選的 CPU 模型服務，與應用程式共享網路命名空間，維持 loopback-only 設定。
  # 此服務不會自動下載任何模型；使用前須自行確認精確權重與 tokenizer 的授權。
  ollama:
    profiles:
      - local-model
    image: ${MIRAGE_OLLAMA_IMAGE:-ollama/ollama:0.17.1}
    network_mode: service:mirage
    depends_on:
      mirage:
        condition: service_started
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama_models:/root/.ollama
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  mirage_output:
  ollama_models:
