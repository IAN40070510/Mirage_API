services:
  mirage:
    build:
      context: .
      target: runtime
    image: mirage-api:local
    init: true
    environment:
      MIRAGE_DEMO_MODE: ${MIRAGE_DEMO_MODE:-fallback}
      MIRAGE_DOMAIN: ${MIRAGE_DOMAIN:-ecommerce}
      MIRAGE_APP_CONFIG: /app/configs/app.yaml
      MIRAGE_DOMAINS_DIR: /app/domains
      MIRAGE_SECURITY_TAXONOMIES_DIR: /app/inputs/security_taxonomies
      MIRAGE_DEMO_ORIGIN: http://127.0.0.1:${MIRAGE_HTTP_PORT:-8000}
      MIRAGE_OUTPUT_ROOT: /app/generated
      MIRAGE_LLM_CONFIG: /app/configs/llm.yaml
      MIRAGE_POSTGRES_DSN: ${MIRAGE_POSTGRES_DSN:-postgresql://mirage:mirage@postgres:5432/mirage}
    ports:
      - "127.0.0.1:${MIRAGE_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mirage_output:/app/generated
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: ${MIRAGE_POSTGRES_IMAGE:-postgres:17.6-alpine}
    environment:
      POSTGRES_DB: ${MIRAGE_POSTGRES_DB:-mirage}
      POSTGRES_USER: ${MIRAGE_POSTGRES_USER:-mirage}
      POSTGRES_PASSWORD: ${MIRAGE_POSTGRES_PASSWORD:-mirage}
    volumes:
      - mirage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # 可選的 CPU 模型服務，與應用程式共享網路命名空間，維持 loopback-only 設定。
  # 此服務不會自動下載任何模型；使用前須自行確認精確權重與 tokenizer 的授權。
  ollama:
    profiles:
      - local-model
    image: ${MIRAGE_OLLAMA_IMAGE:-ollama/ollama:0.17.1}
    network_mode: service:mirage
    depends_on:
      mirage:
        condition: service_started
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama_models:/root/.ollama
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  mirage_output:
  ollama_models:
  mirage_postgres_data:
