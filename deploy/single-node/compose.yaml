  verifier_server_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_server_key"}
  gateway_client_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/gateway_client_ca"}
  verifier_executor_client_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_executor_client_cert"}
  verifier_executor_client_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_executor_client_key"}
  executor_server_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/executor_server_ca"}
  verifier_validator_client_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_validator_client_cert"}
  verifier_validator_client_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_validator_client_key"}
  validator_server_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/validator_server_ca"}
  verifier_publisher_client_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_publisher_client_cert"}
  verifier_publisher_client_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_publisher_client_key"}
  publisher_server_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/publisher_server_ca"}
  verifier_authorizer_client_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_authorizer_client_cert"}
  verifier_authorizer_client_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_authorizer_client_key"}
  authorizer_server_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/authorizer_server_ca"}
  inventory_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/inventory_dsn"}
  inventory_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/inventory_server_cert"}
  inventory_server_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/inventory_server_key"}
  inventory_verifier_client_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/inventory_verifier_client_ca"}
  cart_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/cart_dsn"}
  cart_initial_state: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/cart_initial_state"}
  medusa_publishable_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/medusa_publishable_key"}
  cart_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/cart_server_cert"}
  cart_server_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/cart_server_key"}
  cart_verifier_client_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/cart_verifier_client_ca"}
  validator_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/validator_dsn"}
  validator_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/validator_server_cert"}
  validator_server_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/validator_server_key"}
  verifier_validator_client_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/verifier_validator_client_ca"}
  publisher_reader_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/publisher_reader_dsn"}
  publisher_writer_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/publisher_writer_dsn"}
  publisher_promoter_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/publisher_promoter_dsn"}
  publisher_evidence: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/publisher_evidence"}
  publisher_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/publisher_server_cert"}
