  sender_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/sender_server_cert"}
  sender_server_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/sender_server_key"}
  gateway_sender_client_ca: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/gateway_sender_client_ca"}
  gateway_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/gateway_server_cert"}
  gateway_server_key: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/gateway_server_key"}
