  authorizer_dsn: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/authorizer_dsn"}
  authorizer_server_cert: {file: "${MIRAGE_SINGLE_NODE_SECRETS_DIR:?required}/authorizer_server_cert"}
