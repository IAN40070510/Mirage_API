name: World DB protected contract (isolated)

on:
  push:
    branches:
      - fix/mir-sec-world-001-protected-grant
      - fix/mir-sec-world-001-resume-20261122
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/world-security-contract.yml
      - migrations/**
      - src/deception/world/**
      - src/deception/security/**
      - tests/test_protected_grant.py
      - tests/test_protected_world_executor.py

permissions:
  contents: read

jobs:
  protected-postgres:
    name: Protected World / PostgreSQL 17.6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: mirage_test
          POSTGRES_USER: mirage
          POSTGRES_PASSWORD: mirage_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirage -d mirage_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      MIRAGE_POSTGRES_TEST_DSN: postgresql://mirage:mirage_ci_only@127.0.0.1:5432/mirage_test?connect_timeout=5
      MIRAGE_WORLD_ROLE_TEST_ISOLATED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate documentation
        run: python tools/check_documentation.py
      - name: Run isolated Protected Grant / World Executor / Role tests
        run: python -m pytest -q tests/test_protected_grant.py tests/test_protected_world_executor.py --junitxml=protected-grant-results.xml
      - name: Preserve exact pass/fail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-grant-postgres17-results
          path: protected-grant-results.xml
          if-no-files-found: warn
