name: Container demonstration verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the isolated synthetic demonstration
        run: docker compose up --build --wait --wait-timeout 180

      - name: Exercise attack-shaped requests and logical consistency
        run: docker compose exec -T mirage python tools/verify_domain_api.py --domain ecommerce --base-url http://127.0.0.1:8000

      - name: Copy the verification report
        if: always()
        run: docker compose cp mirage:/app/generated/domains/ecommerce/verification/http-api.json ecommerce-api.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecommerce-container-verification
          path: ecommerce-api.json
          if-no-files-found: warn

      - name: Inspect and stop the isolated services
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
          docker compose down
