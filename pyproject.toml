[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-response-validator"
version = "0.1.0"
description = "Reusable response contract validation PoC"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.135.1,<0.136", "pydantic>=2.13.5,<3", "jsonschema>=4.23,<5", "uvicorn>=0.30,<1", "openapi-core==0.19.5", "PyYAML>=6.0.2,<7", "werkzeug>=3.1,<3.1.2", "Faker==40.44.0"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<0.29"]

[tool.setuptools.package-data]
mirage_validator = ["contracts/*.json"]

[tool.setuptools]
package-dir = {deception = "src/deception"}

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["mirage_validator*", "deception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
